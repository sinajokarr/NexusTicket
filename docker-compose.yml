services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-events}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexusticket-local-dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:alpine
    restart: always

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "${NEXUSTICKET_PORT:-8011}:8000"
    env_file:
      - .env
    environment: 
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-nexusticket-local-dev}@db:3306/${MYSQL_DATABASE:-events}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      - PAYMENT_PUBLIC_BASE_URL=http://127.0.0.1:${NEXUSTICKET_PORT:-8011}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment: 
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-nexusticket-local-dev}@db:3306/${MYSQL_DATABASE:-events}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  mysql_data:
